# ==============================================================================
# GACHIMURA Application - Blue Environment
# Ports: Backend 3001, Frontend 4001 (로컬 헬스체크 및 격리용)
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend-blue:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gachimura-backend-blue
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-gachimura}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gachimura.com}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      GOOGLE_VISION_CREDENTIALS_BASE64: ${GOOGLE_VISION_CREDENTIALS_BASE64:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-https://gachimura.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
    volumes:
      - /home/ubuntu/gachimura-data/uploads:/usr/src/app/uploads
    networks:
      - app-network
    restart: unless-stopped

  frontend-blue:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${NEXT_PUBLIC_KAKAO_CLIENT_ID}
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY}
        NEXT_PUBLIC_GOOGLE_MAP_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAP_API_KEY}
        NEXT_PUBLIC_LINE_CLIENT_ID: ${NEXT_PUBLIC_LINE_CLIENT_ID}
    container_name: gachimura-frontend-blue
    ports:
      - "127.0.0.1:4001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_DOCKER: "true"
      INTERNAL_API_URL: "http://gachimura-backend-blue:3000/api"
    depends_on:
      - backend-blue
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    name: gachimura-network
    external: true
