# ==============================================================================
# GACHIMURA Base Infrastructure Services (상시 가동)
# MySQL 데이터베이스와 Nginx 리버스 프록시를 관리합니다.
# ==============================================================================

services:
  nginx:
    build: ./nginx
    container_name: gachimura-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app-network
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: gachimura-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-gachimura}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\"" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      app-network:
        aliases:
          - database
          - gachimura-db
    restart: unless-stopped

volumes:
  mysql_data:
    name: gachimura-base_mysql_data
    external: true

networks:
  app-network:
    name: gachimura-network
    driver: bridge
