name: Deploy to EC2 (Develop Branch)

# 1. develop 브랜치에 push가 발생할 때만 실행
on:
  push:
    branches:
      - develop

# 같은 서버의 빌드가 겹치지 않도록 실행 중인 배포가 끝난 뒤 진행합니다.
concurrency:
  group: gachimura-ec2-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Auto Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 2. EC2 서버 접속 및 배포 명령어 자동 실행
      - name: SSH into EC2 & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/ubuntu/project-gachimura-main-deployment
            
            # 메인 저장소 develop 브랜치 최신화
            git fetch origin develop
            git reset --hard "${{ github.sha }}"
            
            # 백엔드 & 프론트엔드 서브모듈 동기화 및 최신화
            git submodule update --init --recursive
            
            # 단일 서버 무중단 포트 스위칭(Docker + Nginx Blue-Green) 배포 실행
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
