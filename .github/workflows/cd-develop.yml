name: Deploy to EC2 (Develop Branch)

# 1. develop 브랜치에 push가 발생할 때만 실행
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Auto Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 2. EC2 서버 접속 및 배포 명령어 자동 실행
      - name: SSH into EC2 & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/ubuntu/project-gachimura-main-deployment
            
            # 메인 저장소 develop 브랜치 최신화
            git fetch origin develop
            git reset --hard "${{ github.sha }}"
            
            # 백엔드 & 프론트엔드 서브모듈 동기화 및 최신화
            git submodule update --init --recursive
            
            # 운영 도커 컨테이너 무중단/재빌드 실행
            docker compose -f docker-compose.prod.yml up -d --build
            
            # 불필요한 옛날 도커 빌드 이미지 정리
            docker image prune -f
